name: ALCG CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alcg-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python tests/run_split_suite.py
      - name: Check example syntax
        run: python alcg.py check samples/seed.alcg
      - name: Audit example vocabulary
        run: python alcg.py audit samples/seed.alcg
      - name: Validate v0.2 coverage benchmark
        run: python coverage_lab.py check
      - name: Audit v0.2 coverage proposals
        run: python coverage_lab.py audit
      - name: Validate v0.3 reconstruction and contrast fixtures
        run: python reconstruction_lab.py check
      - name: Validate v0.4 fixed-English coverage bridge
        run: python coverage_bridge.py check
      - name: Check v0.4 finite-world semantic contrasts
        run: python finite_probe.py check
      - name: Validate v0.4 AI reader challenge fixtures
        run: python reader_v04.py check
      - name: Validate v0.5 semantic stability and finite counterexamples
        run: python semantic_lab.py check
      - name: Validate v0.6 English sense and concept coverage
        run: python sense_coverage.py check
      - name: Audit v0.6 sense coverage without claiming reader scores
        run: python sense_coverage.py report
      - name: Validate v0.7 reader trial, contrasts and packet integrity
        run: python reader_trial.py check
      - name: Audit v0.7 non-AI lexical baseline (NOT AI comprehension)
        run: python reader_trial.py baseline-report
      - name: Check v0.8 transparent English-symbol composition patterns
        run: python pattern_lab.py check
      - name: Audit v0.8 selected pattern roundtrips (NOT AI comprehension)
        run: python pattern_lab.py report
      - name: Check v0.9 pattern-transfer reader packet integrity
        run: python pattern_transfer.py check
      - name: Audit v0.9 public three-arm protocol (NOT independent AI comprehension)
        run: python pattern_transfer.py report
      - name: Check v0.10 public-registry positional abbreviation roundtrips
        run: python compact_surface.py check
      - name: Audit v0.10 compact syntax savings and risk probes (NOT AI comprehension)
        run: python compact_surface.py report
      - name: Check v0.11 assistant-authored pattern evolution proposals
        run: python pattern_evolution.py check
      - name: Verify v0.11 review-only report and staging preview
        run: python pattern_evolution.py verify-report
      - name: Check v0.12 machine-mined pattern proposals and pinned artifacts
        run: python pattern_discovery.py check
      - name: Audit v0.12 review-only motifs and dictionary costs (NOT semantic comprehension)
        run: python pattern_discovery.py report
      - name: Validate v0.13 historical nontraining transfer and authored counterexamples
        run: python transfer_lab.py check
      - name: Audit v0.13 shape matching limits (NOT independent AI semantics)
        run: python transfer_lab.py report
      - name: Check v0.14 generated novel structural probes and frozen artifacts
        run: python challenge_generator.py check
      - name: Audit v0.14 metamorphic invariants (NOT independent AI semantics)
        run: python challenge_generator.py report
      - name: Validate v0.15 bounded finite countermodels and replay receipts
        run: python counterexample_lab.py check
      - name: Audit v0.15 supported, inconclusive and unsupported statuses (NOT AI comprehension)
        run: python counterexample_lab.py report
      - name: Validate v0.16 opt-in finite causal interventions and replay receipts
        run: python causal_lab.py check
      - name: Audit v0.16 observational association versus interventions (NOT real-world causal evidence)
        run: python causal_lab.py report
      - name: Validate v0.17 deterministic cross-model fixture and frozen inputs
        run: python family_fixtures_v017.py check
      - name: Check v0.17 finite causal invariance receipts (NOT universal or empirical causality)
        run: python causal_robustness.py check
      - name: Audit v0.17 cross-model classification (NOT AI comprehension)
        run: python causal_robustness.py summary
      - name: Check v0.18 bounded observation-equivalent mechanism search (NOT empirical causality)
        run: python mechanism_search.py check
      - name: Audit v0.18 finite mechanism completion boundaries (NOT AI comprehension)
        run: python mechanism_search.py summary
      - name: Check v0.19 exact bounded active identification receipts (NOT empirical causality)
        run: python active_design.py check
      - name: Audit v0.19 minimum intervention budget and synthetic stopping costs
        run: python active_design.py summary
      - name: Check v0.20 hypothetical noisy-cost Bayesian report and frozen inputs
        run: python noisy_design.py check
      - name: Audit v0.20 greedy information and exact bounded MAP accuracy (NOT empirical accuracy)
        run: python noisy_design.py report
      - name: Check v0.21 asymmetric session-correlated Bayesian report and pinned inputs
        run: python correlated_design.py check
      - name: Audit v0.21 bounded STOP/CONTINUE expected-loss policy (NOT empirical error rates)
        run: python correlated_design.py summary
      - name: Check v0.22 replayable ALCG computation traces and pinned synthetic receipts
        run: python trace_language.py check
      - name: Audit v0.22 English-readable trace evidence and policy labels (NOT independent AI comprehension)
        run: python trace_language.py report
